name: Sync upstream

# Keeps our fork rebased on NousResearch/hermes-agent:main, then rebuilds
# `main` as an integration branch so a new machine can just `git clone`
# and check out `main` to get a runtime-ready fork.
#
# `FEATURE_BRANCHES` carries fork patches. Some still have an open upstream PR; most
# are fork-only now (their upstream PRs were closed on 2026-10-12). As of 2026-11-24:
#
#   fix/busy-path-pre-gateway-dispatch-upstream → #16489 busy-path
#   pre_gateway_dispatch (open). Owner-forward base (#16445/#16485) landed
#   upstream via #55584.
#
#   feature/end-turn-tool-contract-upstream → terminal plugin tools can close a
#   turn without triggering the empty-after-tools nudge path. #20713 closed
#   2026-10-12; fork-only.
#
#   #24853 diagnostic status leak (was fix/diagnostic-status-leak-and-end-turn-
#   nudge) closed 2026-10-12. Upstream now buffers and suppresses recovery
#   statuses itself (display.suppress_warning_notifications), and the carry's
#   12 Nov rebase broke the reconnect watcher (ImportError). Dropped from
#   FEATURE_BRANCHES 2026-11-24; branch kept on origin as a rollback.
#
#   #25119 queued follow-up MEDIA (was fix/queued-followup-media-delivery-
#   upstream) closed without merge. Landed via #82162. Dropped from
#   FEATURE_BRANCHES 2026-09-06.
#
#   fix/undelivered-tool-call-content → recover material assistant content
#   generated during tool calls when interim delivery is disabled. #53544
#   closed 2026-10-12; fork-only.
#
#   fix/telegram-forum-topic-reply-anchor → #61538 quote-reply triggering
#   message in Telegram forum/supergroup topics (open).
#
#   #85081 WhatsApp profile_routes JID/LID/number matching (was fix/whatsapp-
#   profile-route-identity) closed without merge — landed upstream as
#   dca9a54427. Dropped from FEATURE_BRANCHES 2026-09-03.
#
#   #85204 multiplex secondary-profile MCP discovery (was fix/multiplex-
#   secondary-mcp-discovery) closed without merge — landed upstream as
#   ee0e234a2c. Dropped from FEATURE_BRANCHES 2026-09-03.
#
#   #85205 multiplex session peer-fallback fence (was fix/multiplex-session-
#   profile-fence) closed without merge — landed upstream as 7463cd1202
#   (#74285, #88381). Dropped from FEATURE_BRANCHES 2026-09-03.
#
#   #85355 multiplex slash-command profile stamp (was fix/multiplex-slash-
#   cmd-profile-stamp) closed without merge. Superseded by #101247
#   (0437fe66f77). Dropped from FEATURE_BRANCHES 2026-09-06.
#
#   #90058 multiplex session cwd (was fix/multiplex-session-cwd-profile-home)
#   closed without merge. Problem fixed by #101242 (4a7f228e2c1); this
#   branch's approach did not land. Dropped from FEATURE_BRANCHES 2026-09-06.
#
#   #89000 `hermes update --ref` (feat/update-ref) is no longer carried.
#   Its only consumer was the legacy `hermes update --ref` deploy path;
#   deploys now install sealed releases and `hermes update` is retired.
#   #89141 --no-restart closed; upstream has --no-gateway-restart. The
#   branch and the Nous PR are left as they are. Dropped from
#   FEATURE_BRANCHES 2026-09-29.
#
#   fix/gateway-matcher-payload-launcher (gateway identity matcher counts a
#   gateway started by the native payload's bin/hermes) is no longer carried.
#   Upstream landed the same fix as #127865 (7e247c44a6, b8e986cb2b). Dropped
#   from FEATURE_BRANCHES 2026-10-19.
#
#   feat/compression-summary-instructions → configurable
#   compression.summary_instructions. #89399 closed 2026-10-12; fork-only.
#
#   feat/telegram-plugin-callback-handlers → plugin send() markup metadata.
#   #96053 closed 2026-10-12; fork-only.
#
#   fix/opencode-go-reasoning-effort-coverage → reasoning_effort for every
#   OpenCode Go model that takes one. #126103 closed 2026-10-12; fork-only.
#
#   fix/cancelled-turn-interrupts-agent → a cancelled turn task hard-
#   interrupts the agent it was awaiting, so its executor thread stops calling
#   the model and running tools. Upstream PR not opened yet.
#
#   fix/gateway-log-no-message-text (INFO inbound-message log line without
#   message text) is no longer carried. Upstream 53a5c32f18 keeps message text
#   out of INFO logs; upstream's memory_trim.log_every_n (default 1) is set per
#   tenant for the quieter trim. Dropped from FEATURE_BRANCHES 2026-11-24;
#   branch kept on origin as a rollback.
#
#   feat/web-search-depth → optional Exa search knobs and web_search depth
#   (fork #90, #92). Upstream PRs not opened.
#
#   #18413 OpenCode auxiliary /v1 strip (was fix/auxiliary-opencode-strip-
#   trailing-v1) closed without merge — shared Anthropic client strips
#   trailing /v1 (85e6232a0, in v2026.6.19). Dropped 2026-07-23.
#
#   #53038 STT echo toggle (was fix/stt-echo-toggle) closed without merge —
#   equivalent `stt.echo_transcripts` landed upstream as bfc526272 / 4be749d15.
#   Dropped from FEATURE_BRANCHES 2026-07-06.
#
#   #20747 launcher symlink clobber (was fix/launcher-symlink-clobber-upstream)
#   closed without merge — core fix landed upstream as c75e1a03f (Closes #21454).
#   Dropped from FEATURE_BRANCHES 2026-05-29.
#
#   #25183 queued follow-up transcript history (was fix/queued-followup-history-
#   persistence-upstream) merged upstream on NousResearch/hermes-agent:main as
#   commits 9a815b6c8 and cc64a04f6 — dropped from FEATURE_BRANCHES.
#
#   #17165 WhatsApp text batching (was feature/whatsapp-inbound-text-batch)
#   closed without merge — core text debounce landed upstream as b0ce47daa /
#   cddb7283d. Dropped from FEATURE_BRANCHES 2026-05-31.
#
# Drop a branch from FEATURE_BRANCHES (and delete it from the fork) once
# its upstream PR merges or the change is otherwise absorbed upstream.
# Do it promptly: carried branches keep their last pushed base, so partial
# absorption can cause a conflict and an absorbed-then-reverted change can
# come back into `main` from a stale branch (see FORK.md).
#
# Each run rebases the carried branches only in the runner and builds `main`
# from those local rebases; it never pushes a carried branch. Some are the head
# of an open upstream PR, and a daily force-push would re-run Nous CI on them.
# A carried branch moves only when someone resolves a conflict on it and
# pushes it (see FORK.md recovery).
#
# The carry test gate (.github/scripts/carry_test_gate.py) runs upstream's
# tests/gateway and tests/agent plus every carried test file on the rebuilt
# `main`, and plain upstream's verdict on each failing file, before anything is
# pushed. A fork-only failure, an undefined name (ruff F821/F823) or a local
# import that does not resolve, where upstream has neither, stops the sync. A clean text merge is not proof: on 12-15 Nov
# rebases that applied cleanly broke the reconnect watcher and a follow-up path.
# After the push it records a `carry-test-gate` commit status on `main`;
# sealed-release.yml refuses a commit without it.
#
# Runs daily at 03:00 UTC and on manual dispatch. See FORK.md for the
# maintenance model and recovery procedure.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip pytest (fast path for testing the workflow itself)"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write
  # Record the carry test gate on the pushed `main` commit (sealed-release.yml reads it).
  statuses: write
  # Disable non-allowlisted workflows (step after the push).
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/NousResearch/hermes-agent.git
  OPS_OVERLAY_BRANCH: ops-overlay
  INTEGRATION_BRANCH: main
  # Space-separated list of feature branches to rebase and cherry-pick into main.
  # Order matters: listed branches are applied in order after ops-overlay.
  # Empty is the steady-state when no patches are open upstream.
  #
  # Stacked PRs: list only the *tip* branch — cherry-picking its range onto
  # upstream/main brings in ancestor commits once. Do not list older stack
  # branches or commits duplicate/conflict.
  #
  # Independent PRs: add each branch in dependency order (later commits may
  # assume earlier cherry-picks are already on integration main).
  #
  # Currently:
  # - fix/busy-path-pre-gateway-dispatch-upstream is independent (PR #16489);
  #   owner-forward ancestors landed upstream via #55584.
  # - feature/end-turn-tool-contract-upstream is independent (fork-only).
  # - fix/undelivered-tool-call-content is independent (fork-only). It reads the
  #   end_turn carry's per-row flag by getattr, so it also builds alone.
  # - fix/telegram-forum-topic-reply-anchor is independent (PR #61538).
  # - feat/compression-summary-instructions is independent (fork-only).
  # - feat/telegram-plugin-callback-handlers is independent (fork-only).
  # - fix/opencode-go-reasoning-effort-coverage is independent (fork-only).
  # - fix/cancelled-turn-interrupts-agent is independent (fork-only).
  # - feat/web-search-depth is the tip of a two-PR stack (upstream PRs pending):
  #   fork #90 feat/exa-3-provider-knobs (optional web.exa type, dynamic
  #   highlights, max_age_hours and extract cap; exa-py 2.26.0), then fork #92
  #   (optional web_search depth quick | standard | deep, capped by
  #   web.max_depth, default standard). Listing the tip carries both; do not
  #   also list feat/exa-3-provider-knobs.
  FEATURE_BRANCHES: "fix/busy-path-pre-gateway-dispatch-upstream feature/end-turn-tool-contract-upstream fix/undelivered-tool-call-content fix/telegram-forum-topic-reply-anchor feat/compression-summary-instructions feat/telegram-plugin-callback-handlers fix/opencode-go-reasoning-effort-coverage fix/cancelled-turn-interrupts-agent feat/web-search-depth"
  PLUGIN_REPO: pebble-tech/hermes-plugin-gateway-policy
  # Workflows allowed to run on this fork. Two mechanisms use this list:
  # - Strip: the rebuild step removes every other workflow file from integration
  #   `main` before the push. The push uses a PAT, and PAT pushes trigger
  #   workflows, so upstream push-on-main workflows must not be on `main` yet.
  # - Disable: a step after the push disables every other active workflow in the
  #   repo through the Actions API. This covers `ops-overlay`, the carried
  #   branches and fork PRs, which keep upstream's workflow files.
  WORKFLOW_ALLOWLIST: "sync-upstream.yml test-cursor-webhook.yml sealed-release.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    # The carry test gate is most of the run. On Linux (Python 3.14, 3,412 files)
    # it took 99 min at 6 jobs: about 33,600 worker-seconds of tests, so roughly
    # 140 min of tests on a 4-vCPU runner, plus setup. 240 keeps headroom for a
    # slow day; GitHub's hosted-runner job limit is 360 min.
    timeout-minutes: 240
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # Default GITHUB_TOKEN for checkout — SYNC_PUSH_TOKEN is configured only
          # before push. An empty/expired PAT here breaks checkout with auth errors
          # while leaving rebase/test steps unreachable (failed_step: unknown).

      # Later steps check out ops-overlay, feature branches and upstream/main,
      # none of which reliably carry .github/scripts/. Copy the helpers out of
      # the working tree before any checkout and call them from there, or a
      # rebase conflict exits 127 and the issue reports failed_step: unknown.
      - name: Prepare sync failure recorder
        run: |
          SYNC_SCRIPTS="$RUNNER_TEMP/sync-scripts"
          mkdir -p "$SYNC_SCRIPTS"
          cp .github/scripts/record-sync-failure.sh .github/scripts/validate-sync-push-token.sh "$SYNC_SCRIPTS/"
          chmod +x "$SYNC_SCRIPTS"/*.sh
          echo "SYNC_SCRIPTS=$SYNC_SCRIPTS" >> "$GITHUB_ENV"

      # jq is required by record-sync-failure.sh; without it rebase conflicts exit
      # 127 and the failure issue reports failed_step: unknown.
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure git + upstream remote
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "pebble-tech-bot"
          git config user.email "ops@pebble-tech.invalid"
          git remote add upstream "$UPSTREAM_URL"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin --prune --tags
          git fetch upstream --prune
          echo "upstream_sha=$(git rev-parse upstream/main)" >> "$GITHUB_ENV"

      - name: Validate SYNC_PUSH_TOKEN
        env:
          SYNC_PUSH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN }}
        run: |
          SYNC_PUSH_TOKEN="$(printf '%s' "$SYNC_PUSH_TOKEN" | tr -d '[:space:]')"
          export SYNC_PUSH_TOKEN
          bash "$SYNC_SCRIPTS/validate-sync-push-token.sh" "${{ github.repository }}"

      - name: Rebase ops-overlay onto upstream
        run: |
          git checkout -f -B "$OPS_OVERLAY_BRANCH" "origin/$OPS_OVERLAY_BRANCH"
          if ! git rebase upstream/main; then
            bash "$SYNC_SCRIPTS/record-sync-failure.sh" rebase-ops-overlay "$OPS_OVERLAY_BRANCH"
            {
              echo "::error::Conflict rebasing $OPS_OVERLAY_BRANCH onto upstream/main"
              echo "Conflicted files:"
              git diff --name-only --diff-filter=U
            } | tee /tmp/ops-overlay-conflict.txt
            git rebase --abort || true
            exit 1
          fi

      - name: Reload FEATURE_BRANCHES from rebased ops-overlay
        run: |
          # Integration main may lag ops-overlay; read the authoritative list from
          # the rebased ops-overlay workflow file so dropped branches are skipped.
          branches=$(grep -E '^\s+FEATURE_BRANCHES:' .github/workflows/sync-upstream.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "FEATURE_BRANCHES=$branches" >> "$GITHUB_ENV"
          echo "Reloaded FEATURE_BRANCHES: $branches"
          allowlist=$(grep -E '^\s+WORKFLOW_ALLOWLIST:' .github/workflows/sync-upstream.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -n "$allowlist" ]; then
            echo "WORKFLOW_ALLOWLIST=$allowlist" >> "$GITHUB_ENV"
            echo "Reloaded WORKFLOW_ALLOWLIST: $allowlist"
          fi

      # Rebases into run-local branches only. They feed the integration rebuild
      # below and are never pushed, so origin/<branch> (an upstream PR head)
      # keeps its tip until a conflict fix is pushed by hand.
      - name: Rebase each feature branch onto upstream
        run: |
          for branch in $FEATURE_BRANCHES; do
            echo "::group::Rebase $branch"
            git checkout -f -B "$branch" "origin/$branch"
            if ! git rebase upstream/main; then
              bash "$SYNC_SCRIPTS/record-sync-failure.sh" rebase-feature-branch "$branch"
              {
                echo "::error::Conflict rebasing $branch onto upstream/main"
                echo "Conflicted files:"
                git diff --name-only --diff-filter=U
              } | tee "/tmp/${branch//\//-}-conflict.txt"
              git rebase --abort || true
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Rebuild integration branch (main)
        run: |
          git checkout -f -B "$INTEGRATION_BRANCH" upstream/main

          echo "::group::Cherry-pick ops-overlay"
          if ! git cherry-pick "upstream/main..$OPS_OVERLAY_BRANCH"; then
            bash "$SYNC_SCRIPTS/record-sync-failure.sh" cherry-pick-main "$OPS_OVERLAY_BRANCH"
            git cherry-pick --abort || true
            exit 1
          fi
          echo "::endgroup::"

          for branch in $FEATURE_BRANCHES; do
            echo "::group::Cherry-pick $branch"
            if ! git cherry-pick "upstream/main..$branch"; then
              # Stacked later branches include earlier FEATURE_BRANCHES
              # commits. Skip those empty replays; fail on real conflicts.
              cherry_head=$(git rev-parse --git-path CHERRY_PICK_HEAD)
              while [ -f "$cherry_head" ]; do
                conflicts=$(git diff --name-only --diff-filter=U)
                if [ -n "$conflicts" ]; then
                  break
                fi
                if git diff --quiet && git diff --cached --quiet; then
                  echo "skip empty $(git rev-parse --short CHERRY_PICK_HEAD) on $branch (already applied)"
                  if ! git cherry-pick --skip; then
                    break
                  fi
                  continue
                fi
                break
              done
              if [ -f "$cherry_head" ]; then
                bash "$SYNC_SCRIPTS/record-sync-failure.sh" cherry-pick-main "$branch"
                {
                  echo "::error::Conflict cherry-picking $branch into $INTEGRATION_BRANCH"
                  echo "Conflicted files:"
                  git diff --name-only --diff-filter=U
                } | tee "/tmp/${branch//\//-}-cherrypick-conflict.txt"
                git cherry-pick --abort || true
                exit 1
              fi
            fi
            echo "::endgroup::"
          done

          # Strip upstream CI/publish workflows from deploy `main` only.
          # ops-overlay keeps the full upstream tree so rebases stay clean;
          # allowlist is reloaded from the rebased ops-overlay workflow file.
          echo "::group::Strip non-ops workflows from integration main"
          allowlist="${WORKFLOW_ALLOWLIST:-sync-upstream.yml test-cursor-webhook.yml sealed-release.yml}"
          removed=0
          for f in .github/workflows/*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            keep=false
            for a in $allowlist; do
              if [ "$base" = "$a" ]; then
                keep=true
                break
              fi
            done
            if [ "$keep" = false ]; then
              git rm -f --quiet "$f"
              removed=$((removed + 1))
              echo "removed $base"
            else
              echo "keep $base"
            fi
          done
          if [ "$removed" -gt 0 ]; then
            git commit -m "chore(fork): keep only ops workflows on integration main"
          else
            echo "No upstream workflows to strip"
          fi
          echo "::endgroup::"

      - name: Install uv
        if: inputs.skip_tests != 'true'
        uses: astral-sh/setup-uv@v5

      - name: Install ripgrep
        if: inputs.skip_tests != 'true'
        run: sudo apt-get install -y ripgrep

      - name: Install hermes-agent (from integration branch)
        if: inputs.skip_tests != 'true'
        run: |
          # Upstream moved dev deps to [dependency-groups]; `.[all,dev]` no longer
          # installs pytest. Match upstream CI: locked sync on Python 3.14.
          uv python install 3.14
          # GitHub release assets (e.g. kittentts wheels) occasionally 504; retry.
          for attempt in 1 2 3 4 5; do
            if uv sync --locked --python 3.14 --extra all --group dev; then
              exit 0
            fi
            echo "::warning::uv sync failed (attempt ${attempt}/5); retrying in 30s"
            sleep 30
          done
          bash "$SYNC_SCRIPTS/record-sync-failure.sh" install-deps "$INTEGRATION_BRANCH"
          exit 1

      - name: Run focused tests against integration branch
        if: inputs.skip_tests != 'true'
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          source .venv/bin/activate
          if ! python -m pytest \
            tests/gateway/test_pre_gateway_dispatch.py \
            tests/gateway/test_session.py \
            tests/gateway/test_telegram_send_reply_markup.py \
            tests/hermes_cli/test_plugins.py \
            -q --tb=short; then
            bash "$SYNC_SCRIPTS/record-sync-failure.sh" focused-tests "$INTEGRATION_BRANCH"
            exit 1
          fi

      # Fork-vs-upstream gate. Runs upstream's tests/gateway and tests/agent and
      # every carried test file on the rebuilt `main`, then plain upstream at the
      # same base on each failing file; only a fork-only failure (one that also
      # fails when re-run alone), a fork-only ruff F821/F823 finding or a fork-only
      # unresolved local import fails it.
      # Branches pushed by hand or by the Cursor recovery automation reach `main`
      # only through this step. See the job's timeout comment for its runtime.
      - name: Check out upstream base for the carry test gate
        if: inputs.skip_tests != 'true'
        run: |
          git worktree add --detach "$RUNNER_TEMP/upstream-base" "$upstream_sha"
          # From the rebased ops-overlay, not the candidate tree: a carry cannot
          # change the gate that judges it.
          git show "$OPS_OVERLAY_BRANCH:.github/scripts/carry_test_gate.py" > "$SYNC_SCRIPTS/carry_test_gate.py"

      - name: Carry test gate (fork-only failures)
        id: carry_gate
        if: inputs.skip_tests != 'true'
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          source .venv/bin/activate
          if ! python "$SYNC_SCRIPTS/carry_test_gate.py" \
            --candidate "$GITHUB_WORKSPACE" \
            --base "$RUNNER_TEMP/upstream-base" \
            --jobs "$(nproc)" \
            --report "$RUNNER_TEMP/carry-test-gate.json"; then
            bash "$SYNC_SCRIPTS/record-sync-failure.sh" carry-test-gate "$INTEGRATION_BRANCH"
            exit 1
          fi

      - name: Smoke-test gateway-policy plugin against integration branch
        if: inputs.skip_tests != 'true'
        run: |
          source .venv/bin/activate
          git clone --depth=1 "https://github.com/${PLUGIN_REPO}.git" /tmp/plugin
          cd /tmp/plugin
          # Plugin tests stub what they need via conftest.py; the smoke-test
          # catches manifest drift and confirms the plugin still loads.
          if ! python -m pytest -q --tb=short; then
            bash "$SYNC_SCRIPTS/record-sync-failure.sh" plugin-smoke-test "$INTEGRATION_BRANCH"
            exit 1
          fi

      - name: Configure push credentials
        env:
          SYNC_PUSH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN }}
        run: |
          # PAT is required to push workflow-file changes from rebased ops-overlay;
          # GITHUB_TOKEN checkout above keeps fetch alive when the PAT is missing.
          # Re-validate here so a stale workflow on integration main still fails
          # with a clear auth error instead of after rebase/tests.
          SYNC_PUSH_TOKEN="$(printf '%s' "$SYNC_PUSH_TOKEN" | tr -d '[:space:]')"
          export SYNC_PUSH_TOKEN
          bash "$SYNC_SCRIPTS/validate-sync-push-token.sh" "${{ github.repository }}"
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          git config --local credential.helper ""
          git remote set-url origin "https://x-access-token:${SYNC_PUSH_TOKEN}@github.com/${{ github.repository }}.git"

      # FEATURE_BRANCHES are not pushed: see the header comment.
      - name: Push rebased ops-overlay and integration branch
        run: |
          if ! git push --force-with-lease origin "$OPS_OVERLAY_BRANCH"; then
            bash "$SYNC_SCRIPTS/record-sync-failure.sh" push "$OPS_OVERLAY_BRANCH"
            exit 1
          fi
          if ! git push --force-with-lease origin "$INTEGRATION_BRANCH"; then
            bash "$SYNC_SCRIPTS/record-sync-failure.sh" push "$INTEGRATION_BRANCH"
            exit 1
          fi

      # The passing record sealed-release.yml requires. Only a run whose gate
      # passed writes it, so a skip_tests run pushes a `main` that cannot ship.
      - name: Record carry test gate on main
        if: steps.carry_gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse "$INTEGRATION_BRANCH")"
          if ! gh api -X POST "repos/${{ github.repository }}/statuses/$sha" \
            -f state=success -f context=carry-test-gate \
            -f description="no fork-only failures vs upstream ${upstream_sha:0:12}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null; then
            bash "$SYNC_SCRIPTS/record-sync-failure.sh" record-gate "$INTEGRATION_BRANCH"
            exit 1
          fi
          echo "carry-test-gate: success recorded on $sha"

      # `main` is stripped of upstream workflows, but `ops-overlay`, the carried
      # branches and fork PRs keep them; this keeps them from running. A new
      # upstream workflow registers when it lands on a branch, so this runs after
      # the push, and also when the sync fails part-way. It never fails the sync: each workflow it cannot disable is
      # logged as a warning. Matches on file name, not display name. Workflows
      # already `disabled_manually` or `disabled_inactivity` are left alone.
      - name: Disable non-allowlisted workflows
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          allowlist="${WORKFLOW_ALLOWLIST:-sync-upstream.yml test-cursor-webhook.yml sealed-release.yml}"
          if ! workflows=$(gh api --paginate "repos/${{ github.repository }}/actions/workflows" \
            --jq '.workflows[] | select(.state == "active" and (.path | startswith(".github/workflows/"))) | [.id, (.path | split("/") | last)] | @tsv'); then
            echo "::warning::Could not list workflows; none disabled"
            exit 0
          fi
          while IFS=$'\t' read -r id file; do
            [ -n "$id" ] || continue
            keep=false
            for a in $allowlist; do
              if [ "$file" = "$a" ]; then
                keep=true
                break
              fi
            done
            if [ "$keep" = true ]; then
              echo "keep $file"
            elif gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$id/disable" >/dev/null; then
              echo "disabled $file ($id)"
            else
              echo "::warning::Could not disable workflow $file ($id)"
            fi
          done <<< "$workflows"

      - name: Open / update sync-failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const upstreamSha = process.env.upstream_sha || "(unknown)";
            const today = new Date().toISOString().slice(0, 10);

            let failure = {
              failed_step: "unknown",
              failed_branch: "",
              upstream_sha: upstreamSha,
              conflict_files: [],
            };
            const failurePath = path.join(process.env.GITHUB_WORKSPACE, ".sync-failure.json");
            if (fs.existsSync(failurePath)) {
              failure = { ...failure, ...JSON.parse(fs.readFileSync(failurePath, "utf8")) };
            }

            const yamlBlock = [
              "```yaml",
              "sync-failure:",
              `  upstream_sha: ${failure.upstream_sha}`,
              `  failed_step: ${failure.failed_step}`,
              `  failed_branch: ${failure.failed_branch || ""}`,
              failure.conflict_files?.length
                ? `  conflict_files:\n${failure.conflict_files.map((f) => `    - ${f}`).join("\n")}`
                : "  conflict_files: []",
              `  workflow_run_url: ${runUrl}`,
              "```",
            ].join("\n");

            const body = [
              `The scheduled upstream-sync workflow failed.`,
              ``,
              `- Run: ${runUrl}`,
              `- Upstream \`main\` at: \`${upstreamSha}\``,
              `- Failed step: \`${failure.failed_step}\``,
              failure.failed_branch ? `- Source branch: \`${failure.failed_branch}\`` : null,
              failure.conflict_files?.length
                ? `- Conflicted files: ${failure.conflict_files.map((f) => `\`${f}\``).join(", ")}`
                : null,
              ``,
              `**Cursor agent:** follow [.cursor/skills/recover-fork-sync/SKILL.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/.cursor/skills/recover-fork-sync/SKILL.md) (see \`sync-failure\` block below).`,
              ``,
              yamlBlock,
              ``,
              `Likely causes (in rough order of frequency):`,
              `1. Rebase conflict on a feature branch — upstream refactored the code the patch touches.`,
              `2. Cherry-pick conflict when rebuilding \`main\` — two feature branches touch the same lines.`,
              `3. Focused tests failed — upstream changed a signature the tests depend on.`,
              `4. Carry test gate failed — a carry breaks a test upstream passes, or adds an undefined name. The run summary lists each one.`,
              `5. Plugin smoke-test failed — \`pebble-tech/hermes-plugin-gateway-policy\` no longer loads cleanly.`,
              `6. Rebase conflict on \`ops-overlay\` — rare; only touches \`.github/workflows/sync-upstream.yml\` and \`FORK.md\`.`,
              ``,
              `If upstream absorbed the patch (closed/superseded PR), drop the branch from \`FEATURE_BRANCHES\` via \`ops-overlay\` — do not rebase the dead branch.`,
              ``,
              `Setup: [FORK_SYNC_AUTOMATION.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/FORK_SYNC_AUTOMATION.md)`,
            ]
              .filter(Boolean)
              .join("\n");

            function issuesDisabledError(err) {
              const msg = String(err?.message || err || "");
              const status = err?.status ?? err?.response?.status;
              return status === 410 || /issues has been disabled/i.test(msg);
            }

            let issueNumber = null;
            try {
              const { data: openIssues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                labels: "sync-failure",
              });
              if (openIssues.length > 0) {
                issueNumber = openIssues[0].number;
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `Another sync failure (${today}) at upstream \`${upstreamSha}\`: ${runUrl}\n\n${yamlBlock}`,
                });
              } else {
                const { data: issue } = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `Upstream sync failed (${today})`,
                  body,
                  labels: ["sync-failure"],
                });
                issueNumber = issue.number;
              }
            } catch (err) {
              if (issuesDisabledError(err)) {
                core.warning(
                  "Upstream sync failed, but this repository has GitHub Issues disabled — cannot open or update a sync-failure issue. " +
                    `See the workflow log at ${runUrl}`,
                );
              } else {
                throw err;
              }
            }

            core.setOutput("issue_number", issueNumber ?? "");
            core.setOutput("failed_step", failure.failed_step);
            core.setOutput("failed_branch", failure.failed_branch || "");
            core.setOutput("conflict_files", JSON.stringify(failure.conflict_files || []));
        id: sync_failure_issue

      - name: Notify Cursor sync recovery automation
        if: failure()
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.CURSOR_SYNC_RECOVERY_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.CURSOR_SYNC_RECOVERY_WEBHOOK_KEY }}
          UPSTREAM_SHA: ${{ env.upstream_sha }}
          FAILED_STEP: ${{ steps.sync_failure_issue.outputs.failed_step }}
          FAILED_BRANCH: ${{ steps.sync_failure_issue.outputs.failed_branch }}
          CONFLICT_FILES: ${{ steps.sync_failure_issue.outputs.conflict_files }}
          ISSUE_NUMBER: ${{ steps.sync_failure_issue.outputs.issue_number }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_KEY" ]; then
            echo "Cursor webhook secrets not configured, skipping"
            exit 0
          fi
          payload=$(jq -n \
            --arg event "sync-failure" \
            --arg repository "${{ github.repository }}" \
            --arg upstream_sha "$UPSTREAM_SHA" \
            --arg failed_step "$FAILED_STEP" \
            --arg failed_branch "$FAILED_BRANCH" \
            --argjson conflict_files "$CONFLICT_FILES" \
            --arg workflow_run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg issue_number "$ISSUE_NUMBER" \
            '{
              event: $event,
              repository: $repository,
              upstream_sha: $upstream_sha,
              failed_step: $failed_step,
              failed_branch: $failed_branch,
              conflict_files: $conflict_files,
              workflow_run_url: $workflow_run_url,
              issue_number: (if $issue_number == "" then null else ($issue_number | tonumber) end)
            }')
          curl -sf -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload"
          echo "Cursor sync recovery webhook delivered"
